name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Ruff lint
        run: >-
          poetry run ruff check
          src
          tests
          main.py
          currency_to_int.py
          extract_data.py
          extract_gross.py

      - name: Ruff format
        run: >-
          poetry run ruff format --check
          src
          tests
          main.py
          currency_to_int.py
          extract_data.py
          extract_gross.py

      - name: Tests
        run: poetry run pytest

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Tests
        run: poetry run pytest

[tool.poetry]
name = "imdb-movie-analysis"
version = "0.1.0"
description = "Reproducible analysis of IMDb movie metadata and box-office data."
authors = ["Diogo Ribeiro"]
license = "MIT"
packages = [{ include = "imdb_movie_analysis", from = "src" }]

[tool.poetry.scripts]
imdb-movie-analysis = "imdb_movie_analysis.cli:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
beautifulsoup4 = ">=4.12,<5.0"
pandas = ">=2.2,<3.0"
requests = ">=2.32,<3.0"

[tool.poetry.group.dev.dependencies]
jupyterlab = ">=4.2,<5.0"
pytest = ">=8.0,<10.0"
ruff = ">=0.13,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
